name: Validate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: pnpm site-maintainer ci-policy --base "$BASE_SHA" --head "$HEAD_SHA" --head-ref "$HEAD_REF"
      - run: pnpm site-maintainer check
      - if: steps.policy.outputs.release == 'true'
        run: pnpm site-maintainer rebuild --all
      - if: steps.policy.outputs.release == 'true'
        run: git diff --exit-code -- . ':(exclude)generated/update-report.md'
      - if: steps.policy.outputs.full_validation == 'true'
        run: pnpm typecheck
      - if: steps.policy.outputs.full_validation == 'true'
        run: pnpm test
      - if: steps.policy.outputs.full_validation == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.policy.outputs.full_validation == 'true'
        run: pnpm test:e2e --project=mobile --project=desktop
      - if: steps.policy.outputs.full_validation == 'true'
        run: pnpm build
      - if: steps.policy.outputs.full_validation == 'true'
        run: pnpm test:budgets
      - if: steps.policy.outputs.full_validation == 'true'
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
